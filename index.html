<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ragdoll Showdown</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f3; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  #ui { position: fixed; left: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 300px); }
  button { font: 600 14px system-ui, sans-serif; padding: 9px 14px; border: 0; border-radius: 10px;
           background: #1f2937; color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  button:hover { background: #374151; }
  button.active { background: #f59e0b; color: #1f2937; }
  button.mp { background: #2563eb; }
  button.mp:hover { background: #1d4ed8; }
  button kbd { font: inherit; opacity: .55; margin-left: 4px; }
  button[data-tool] { position: relative; overflow: hidden; }
  button[data-tool] .cd { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: #ef4444; }
  #cdbar { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); width: 46px; height: 5px;
           background: rgba(0,0,0,.4); border-radius: 3px; overflow: hidden; display: none; pointer-events: none; }
  #cdbar i { display: block; height: 100%; width: 0; background: #fff; }
  #charge { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); width: 120px; pointer-events: none; display: none; text-align: center; }
  #charge span { font: 800 11px system-ui, sans-serif; color: #fff; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #charge div { height: 8px; margin-top: 3px; background: rgba(0,0,0,.45); border-radius: 4px; overflow: hidden; }
  #charge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #facc15, #f97316, #dc2626); }
  #score { position: fixed; right: 16px; top: 16px; background: #1f2937; color: #fff; padding: 9px 14px;
           border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #alert { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); background: #dc2626; color: #fff; font-weight: 800;
           padding: 8px 18px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #alert.show { opacity: 1; }
  #prompt { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); background: #fff; color: #111827; font-weight: 800;
            padding: 8px 16px; border-radius: 10px; font-size: 15px; box-shadow: 0 3px 12px rgba(0,0,0,.25); pointer-events: none; display: none; white-space: nowrap; }
  #prompt kbd { font: 800 13px ui-monospace, monospace; background: #111827; color: #fff; border-radius: 5px; padding: 2px 7px; margin: 0 2px; }
  #prompt.stuck { background: #dc2626; color: #fff; }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(17,24,39,.75);
          color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; pointer-events: none; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; display: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); border-radius: 1px; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
  body.locked.fp #crosshair { display: block; }
  body.locked canvas { cursor: none; }
  /* touch controls: shown once you touch the screen */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch.fp #crosshair { display: block; }
  body.touch #hint { display: none; }
  body.touch #prompt { bottom: 190px; white-space: normal; text-align: center; max-width: calc(100% - 48px); }
  body.touch #score { top: 64px; bottom: auto; right: 16px; transform: none; }
  #stick { position: fixed; left: 28px; bottom: 28px; width: 140px; height: 140px; border-radius: 50%; touch-action: none;
           background: rgba(17,24,39,.22); border: 2px solid rgba(255,255,255,.55); }
  #knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px; border-radius: 50%;
          background: rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(0,0,0,.25); pointer-events: none; }
  .tb { position: fixed; width: 60px; height: 60px; padding: 0; border-radius: 50%; font: 800 20px system-ui, sans-serif;
        background: rgba(17,24,39,.6); touch-action: none; -webkit-tap-highlight-color: transparent; }
  .tb.on { background: #f59e0b; color: #1f2937; }
  #tFire { right: 24px; bottom: 28px; width: 88px; height: 88px; font-size: 32px; }
  #tJump { right: 128px; bottom: 24px; }
  #tE { right: 24px; bottom: 132px; }
  #tF { right: 98px; bottom: 112px; }
  #tThrow { right: 172px; bottom: 96px; }
  #mp { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  #mp.open { display: flex; }
  #mp .card { background: #fff; color: #111827; border-radius: 16px; padding: 20px; width: min(420px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  #mp h2 { margin: 0 0 6px; font-size: 20px; }
  #mp p { margin: 0 0 14px; color: #4b5563; font-size: 14px; line-height: 1.45; }
  #mp .row { display: flex; gap: 8px; margin-bottom: 12px; }
  #mp input { flex: 1; min-width: 0; font: 700 18px ui-monospace, monospace; letter-spacing: 4px; text-transform: uppercase;
              padding: 8px 12px; border: 2px solid #d1d5db; border-radius: 10px; }
  #mp input:focus { outline: none; border-color: #2563eb; }
  #mpStatus { background: #f3f4f6; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #111827; min-height: 20px; margin-bottom: 12px; }
  #mpStatus b { font: 800 22px ui-monospace, monospace; letter-spacing: 4px; color: #2563eb; }
  #mp .foot { display: flex; justify-content: space-between; gap: 8px; }
  #mp .ghost { background: #e5e7eb; color: #111827; box-shadow: none; }
  #mp .ghost:hover { background: #d1d5db; }
  .bubble { position: fixed; transform: translate(-50%, -100%); background: #fff; color: #111827; font-weight: 900;
            font-size: 18px; padding: 4px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0,0,0,.2); animation: pop .9s ease-out forwards; }
  .bubble.you { background: #fde68a; }
  .bubble.friend { background: #fed7aa; }
  @keyframes pop { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -20px; } }
  @media (max-width: 700px) {
    button kbd { display: none; }
    #ui { max-width: 100%; }
    #score { top: auto; bottom: 64px; right: 50%; transform: translateX(50%); white-space: nowrap; }
    #hint { white-space: normal; text-align: center; width: calc(100% - 64px); border-radius: 14px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body class="fp">
<div id="ui">
  <button data-tool="blaster" class="active">🔫 Blaster<kbd>1</kbd><span class="cd"></span></button>
  <button data-tool="plant">🪴 Plant<kbd>2</kbd><span class="cd"></span></button>
  <button data-tool="grab">✋ Grab<kbd>3</kbd></button>
  <button id="reset">Reset<kbd>R</kbd></button>
  <button id="npcBtn">🤖 NPC: On<kbd>N</kbd></button>
  <button id="mpBtn" class="mp">👥 Play with friends</button>
</div>
<div id="score"></div>
<div id="alert"></div>
<div id="hint"></div>
<div id="prompt"></div>
<div id="crosshair"></div>
<div id="cdbar"><i></i></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="tFire" class="tb big">🔫</button>
  <button id="tJump" class="tb">⤒</button>
  <button id="tE" class="tb">E</button>
  <button id="tF" class="tb">F</button>
  <button id="tThrow" class="tb" hidden>💪</button>
</div>
<div id="charge"><span>THROW POWER</span><div><i></i></div></div>
<div id="mp">
  <div class="card">
    <h2>Play with friends</h2>
    <p>One device hosts and gets a room code. Up to 3 friends open this same file on their devices and join with that code (4 players max). Best on the same Wi-Fi.</p>
    <div class="row"><button id="hostBtn" class="mp" style="flex:1">Host a game</button></div>
    <div class="row"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"><button id="joinBtn" class="mp">Join</button></div>
    <div id="mpStatus">Not connected. You're playing solo.</div>
    <div class="foot"><button id="leaveBtn" class="ghost">Leave game</button><button id="closeBtn" class="ghost">Close</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as CANNON from 'cannon-es';

/* ================= Constants & shared state ================= */
const GRAVITY = 30, ARENA = 44, WANDER = 36;
const GROUP = { WORLD: 1, WALL: 2, NPC: 4, P1: 8, P2: 16, P3: 32, P4: 64 };
const ALL_CHARS = GROUP.NPC | GROUP.P1 | GROUP.P2 | GROUP.P3 | GROUP.P4;
const MAX_PLAYERS = 4;
const NAMES = ['torso', 'head', 'armL', 'armR', 'legL', 'legR'];
const PARTS = {
  torso: { size: [2, 2, 1], rest: [0, 3, 0],     mass: 4,   mat: 'torso' },
  head:  { head: true,      rest: [0, 4.475, 0], mass: 1,   mat: 'skin', pivot: [0, 4, 0] },
  armL:  { size: [1, 2, 1], rest: [1.5, 3, 0],   mass: 1.2, mat: 'skin', pivot: [1.5, 3.6, 0] },
  armR:  { size: [1, 2, 1], rest: [-1.5, 3, 0],  mass: 1.2, mat: 'skin', pivot: [-1.5, 3.6, 0] },
  legL:  { size: [1, 2, 1], rest: [0.5, 1, 0],   mass: 1.6, mat: 'legs', pivot: [0.5, 2, 0] },
  legR:  { size: [1, 2, 1], rest: [-0.5, 1, 0],  mass: 1.6, mat: 'legs', pivot: [-0.5, 2, 0] },
};
const COOLDOWN = { blaster: 2.0, plant: 4.0 };   // seconds between shots / throws
const HOLD_MAX = 4.5;                            // how far in front of you a grabbed person can be held
const PEER_OPTS = {};                 // PeerJS's free public signalling server is used by default
const ROOM_PREFIX = 'ragdoll-showdown-v1-';
let tool = 'blaster';
let firing = false, nextFire = 0, looking = null, lockFailed = false, tpDist = 11;
const keys = new Set();
const plants = [], effects = [];
let plantId = 0;
const pointerNdc = new THREE.Vector2();
const scores = { p1: 0, p2: 0, p3: 0, p4: 0, npc: 0 };
const SCORE_KEYS = ['p1', 'p2', 'p3', 'p4', 'npc'];
const settings = { npcAI: true };     // off: the NPC is just a limp ragdoll to mess with
const toC = (v) => new CANNON.Vec3(v.x, v.y, v.z);
const toT = (v) => new THREE.Vector3(v.x, v.y, v.z);
const r3 = (n) => Math.round(n * 1000) / 1000;

/* ================= Rendering ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f3);
scene.fog = new THREE.Fog(0xcfe3f3, 90, 190);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 300);
camera.rotation.order = 'YXZ';
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f70, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(18, 44, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 140 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xe9eef2, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(ARENA * 2, 44, 0xb3c0cb, 0xd2dae1);
grid.position.y = 0.01;
scene.add(grid);
const borderMat = new THREE.MeshStandardMaterial({ color: 0xa7b4c0, roughness: 0.9 });
const BORDER = [[0, ARENA, ARENA * 2 + 0.6, 0.6], [0, -ARENA, ARENA * 2 + 0.6, 0.6], [ARENA, 0, 0.6, ARENA * 2], [-ARENA, 0, 0.6, ARENA * 2]];
for (const [x, z, w, d] of BORDER) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.6, d), borderMat);
  b.position.set(x, 0.3, z); b.receiveShadow = true; b.castShadow = true; scene.add(b);
}

/* ================= Physics ================= */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -GRAVITY, 0) });
world.solver.iterations = 25;
world.allowSleep = false;
const physMat = new CANNON.Material('body');
world.defaultContactMaterial = new CANNON.ContactMaterial(physMat, physMat, { friction: 0.5, restitution: 0.15 });
const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: physMat });
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);
for (const [x, z, ry] of [[ARENA, 0, -Math.PI / 2], [-ARENA, 0, Math.PI / 2], [0, ARENA, Math.PI], [0, -ARENA, 0]]) {
  const wall = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: physMat });
  wall.position.set(x, 0, z);
  wall.quaternion.setFromEuler(0, ry, 0);
  wall.collisionFilterGroup = GROUP.WALL;   // invisible walls only stop ragdolls, not plants
  world.addBody(wall);
}
for (const [x, z, w, d] of BORDER) {
  const kerb = new CANNON.Body({ mass: 0, material: physMat, shape: new CANNON.Box(new CANNON.Vec3(w / 2, 0.3, d / 2)) });
  kerb.position.set(x, 0.3, z);
  world.addBody(kerb);
}

/* ================= Containers: bin, fridge, wardrobe, chest freezer ================= */
// Boxes you can shut someone inside. 'lid' ones open at the top (hinged along the back edge),
// 'door' ones open at the front (hinged on the left edge). Close one with someone inside and they're stuck.
// Each is built in its own local frame (front faces local +z) and turned by ry.
const LID_OPEN = -1.9, LID_CLOSED = 0;
const stdMat = (color, roughness = 0.6, extra) => new THREE.MeshStandardMaterial({ color, roughness, ...extra });
const toLocal = (c, x, z) => [(x - c.x) * c.cos - (z - c.z) * c.sin, (x - c.x) * c.sin + (z - c.z) * c.cos];
const toWorld = (c, lx, lz) => [c.x + lx * c.cos + lz * c.sin, c.z - lx * c.sin + lz * c.cos];
function addBox(c, parent, sx, sy, sz, x, y, z, mat, solid) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  if (solid) { c.meshes.push(m); c.body.addShape(new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)), new CANNON.Vec3(x, y, z)); }
  return m;
}
function makeContainer(cfg) {
  const c = { base: 0, talk: cfg.id, ...cfg, open: false, angle: LID_CLOSED, pushes: 0, trap: new Map(), meshes: [], cos: Math.cos(cfg.ry), sin: Math.sin(cfg.ry) };
  const { w, h, d, t } = c;
  c.group = new THREE.Group();
  c.group.position.set(c.x, c.base, c.z); c.group.rotation.y = c.ry;
  scene.add(c.group);
  c.body = new CANNON.Body({ mass: 0, material: physMat });
  addBox(c, c.group, w, t, d, 0, t / 2, 0, c.inMat, true);                 // floor
  addBox(c, c.group, w, h, t, 0, h / 2, -d / 2 + t / 2, c.mat, true);      // back
  addBox(c, c.group, t, h, d, -w / 2 + t / 2, h / 2, 0, c.mat, true);      // sides
  addBox(c, c.group, t, h, d, w / 2 - t / 2, h / 2, 0, c.mat, true);
  if (c.kind === 'lid') addBox(c, c.group, w, h, t, 0, h / 2, d / 2 - t / 2, c.mat, true);   // front wall
  else addBox(c, c.group, w, t, d, 0, h - t / 2, 0, c.mat, true);                          // roof
  c.body.position.set(c.x, c.base, c.z);
  c.body.quaternion.setFromEuler(0, c.ry, 0);
  world.addBody(c.body);
  // the moving parts ("leaves"): a lid, one door, or a pair of double doors that swing apart
  const leaf = (size, pivotAt, meshAt, sign) => {
    const pivot = new THREE.Group();
    pivot.position.set(...pivotAt);
    c.group.add(pivot);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), c.doorMat);
    mesh.position.set(...meshAt); mesh.castShadow = true; mesh.receiveShadow = true;
    pivot.add(mesh);
    c.meshes.push(mesh);
    const body = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: physMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(size[0] / 2, size[1] / 2, size[2] / 2)));
    world.addBody(body);
    return { pivot, mesh, body, sign };
  };
  if (c.kind === 'lid') c.leaves = [leaf([w + 0.2, 0.22, d + 0.15], [0, h, -d / 2], [0, 0.11, d / 2], 1)];   // hinged along the back top edge
  else if (c.kind === 'door') c.leaves = [leaf([w + 0.1, h, 0.22], [-w / 2, 0, d / 2], [w / 2, h / 2, 0.11], 1)];   // hinged up the front left edge
  else c.leaves = [leaf([w / 2 - 0.02, h, 0.22], [-w / 2, 0, d / 2], [w / 4, h / 2, 0.11], 1),             // double: left and right edges
                   leaf([w / 2 - 0.02, h, 0.22], [w / 2, 0, d / 2], [-w / 4, h / 2, 0.11], -1)];
  c.door = c.leaves[0].mesh;
  c.build(c);
  const [ex, ez] = toWorld(c, 0, d / 2 + 1.8);
  c.exit = new THREE.Vector3(ex, c.base, ez);                          // where you land when you climb out
  c.stand = { x: c.x, y: c.base + t, z: c.z };                          // where you stand up inside it
  // where the NPC stands to toss someone in: in front, but off to the side of a single door (clear of its swing)
  const [fx_, fz] = c.kind === 'door' ? toWorld(c, w / 2 + 1.4, d / 2 + 1.6) : toWorld(c, 0, d / 2 + 1.9);
  c.front = new THREE.Vector3(fx_, c.base, fz);
  c.hop = c.kind === 'lid' ? 5.5 : 0.8;                           // how high you leap when climbing out
  placeDoor(c);
  return c;
}
const _lp = new THREE.Vector3(), _lq = new THREE.Quaternion();
function placeDoor(c) {
  for (const l of c.leaves) {
    if (c.kind === 'lid') l.pivot.rotation.x = c.angle; else l.pivot.rotation.y = c.angle * l.sign;
    l.mesh.getWorldPosition(_lp); l.mesh.getWorldQuaternion(_lq);
    l.body.position.set(_lp.x, _lp.y, _lp.z);
    l.body.quaternion.set(_lq.x, _lq.y, _lq.z, _lq.w);
    l.body.aabbNeedsUpdate = true;
  }
}
const darkMat = stdMat(0x111827, 0.5);
const UPSTAIRS = 9;               // height of the house's upstairs floor
const wardrobe = (id, x, z, ry, base) => makeContainer({ id, talk: 'wardrobe', name: 'wardrobe', done: 'closeted', kind: 'double', x, z, ry, base, w: 6.4, h: 7, d: 3.8, t: 0.3,
  mat: stdMat(0x8b5a2b, 0.7), inMat: stdMat(0x5c3a1a, 0.9), doorMat: stdMat(0x9c6631, 0.6),
  build(c) {
    addBox(c, c.group, c.w + 0.4, 0.3, c.d + 0.3, 0, c.h + 0.15, 0, stdMat(0x6f4421, 0.7));       // crown
    const knobMat = stdMat(0xd4a017, 0.3, { metalness: 0.6 }), panelMat = stdMat(0x8a5729, 0.7);
    for (const l of c.leaves) {     // a knob by the middle edge and a raised panel on each door
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), knobMat);
      knob.position.set(l.sign * (c.w / 4 - 0.35), 0, 0.2); knob.castShadow = true; l.mesh.add(knob);
      addBox(c, l.mesh, c.w / 2 - 0.9, c.h - 1.4, 0.06, 0, 0, 0.13, panelMat);
    }
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, c.w - 0.6, 10), stdMat(0xc0c0c0, 0.3, { metalness: 0.7 }));
    rail.rotation.z = Math.PI / 2; rail.position.set(0, c.h - 0.9, 0); c.group.add(rail);     // clothes rail
  } });
const CONTAINERS = [
  makeContainer({ id: 'bin', name: 'bin', done: 'binned', kind: 'lid', x: 6, z: -14, ry: Math.PI / 2, w: 5.6, h: 3.6, d: 4.2, t: 0.3,   // outside, by the house
    mat: stdMat(0x2f7d4f), inMat: stdMat(0x1d4a31, 0.9), doorMat: stdMat(0x245f3c, 0.5),
    build(c) {

/* ================= Hits ================= */
function hitChar(ch, body, impulse, point, kind, launch, attacker) {
  const ent = entityOf(ch);
  if (ent) { endDrag(ent); if (ent === me) firing = false; }
  if (ch === npc && brain.drag) releaseDrag(false);
  if (ch.hit(body, impulse, point, launch)) {
    fx.bubble(ch, kind);
    if (kind === 'plant' || kind === 'furn') fx.sfx('bonk');
    if (attacker && attacker !== ch) { scores[attacker.key]++; updateScore(); }
  }
}
function resolveHit(hit) {
  let o = hit.object;
  while (o && !o.userData.body && !o.userData.plant && !o.userData.furn) o = o.parent;
  if (!o) return {};
  return o.userData.body ? { body: o.userData.body } : o.userData.plant ? { plant: o.userData.plant } : { furn: o.userData.furn };
}
function shove(f, dir, point, by, k) {      // knock a piece of furniture about
  const m = Math.min(f.body.mass, 8) * k;
  f.body.applyImpulse(new CANNON.Vec3(dir.x * m, dir.y * m + m * 0.4, dir.z * m), toC(point).vsub(f.body.position));
  f.owner = by; f.thrownAt = performance.now();
}
const raycaster = new THREE.Raycaster();

/* ================= Player actions (run on the host; the guest's arrive over the network) ================= */
// cooldown check on the host (a little slack for the guest's network timing)
function useCooldown(p, k) {
  const now = performance.now();
  if (now < p.cd[k] - (p === me ? 0 : 150)) return false;
  p.cd[k] = now + COOLDOWN[k] * 1000;
  return true;
}
function doShoot(p, origin, dir, muzzle) {
  if (p.ch.state !== 'up' || !useCooldown(p, 'blaster')) return;
  raycaster.set(origin, dir);
  const hit = raycaster.intersectObjects([...meshesExcept(p.ch), ...plants.map((x) => x.mesh), ...sceneryMeshes, ground], true)[0];
  const end = hit ? hit.point.clone() : origin.clone().addScaledVector(dir, 90);
  fx.tracer(muzzle, end, p.tracer); fx.flash(muzzle, 0.3); if (hit) fx.flash(end, 1);
  fx.sfx('pew', p.key);
  if (!hit) return;
  const r = resolveHit(hit);
  if (r.body) {
    const h = new THREE.Vector2(dir.x, dir.z).normalize();
    const up = r.body.char === npc ? 48 : 30;                      // first shot launches them
    hitChar(r.body.char, r.body, new CANNON.Vec3(dir.x * 45, dir.y * 45 + 10, dir.z * 45), toC(hit.point), 'shot',
            new CANNON.Vec3(h.x * 10, up, h.y * 10), p.ch);
  } else if (r.plant) {
    r.plant.body.applyImpulse(new CANNON.Vec3(dir.x * 14, dir.y * 14 + 6, dir.z * 14), toC(hit.point).vsub(r.plant.body.position));
  } else if (r.furn) shove(r.furn, dir, hit.point, p.ch, 9);
}
function doThrow(p, origin, dir) {
  if (p.ch.state !== 'up' || !useCooldown(p, 'plant')) return;
  raycaster.set(origin, dir);
  const hit = raycaster.intersectObjects([...meshesExcept(p.ch), ...sceneryMeshes, ground], false)[0];
  const start = origin.clone().addScaledVector(dir, 1.4).add(new THREE.Vector3(0, -0.4, 0));
  const target = hit ? hit.point.clone() : start.clone().addScaledVector(dir, 30);
  const tch = hit && hit.object.userData.body ? hit.object.userData.body.char : null;
  if (tch && tch.state === 'up') {
    const T = THREE.MathUtils.clamp(target.distanceTo(start) / 30, 0.25, 1.1);
    target.add(toT(tch.carry).setY(0).multiplyScalar(T));      // lead a running target
  }

}
function doGrab(p, origin, dir) {
  if (p.ch.state !== 'up' || p.drag) return;

  const hit = raycaster.intersectObjects([...meshesExcept(p.ch), ...sceneryMeshes], false)[0];
  if (!hit || hit.distance > 14) return;
  const f = hit.object.userData.furn;
  if (f) {                       // pick up furniture (heavier pieces just get dragged along the floor)
    if (f.heldBy) return;
    p.dragPlane.setFromNormalAndCoplanarPoint(dir.clone().negate(), hit.point);
    p.joint.position.copy(toC(hit.point));
    const c = new CANNON.PointToPointConstraint(f.body, f.body.pointToLocalFrame(toC(hit.point)), p.joint, new CANNON.Vec3(), 300 + f.body.mass * 45);
    world.addConstraint(c);
    p.drag = { c, body: f.body, ch: null, furn: f };
    f.heldBy = p.ch;
    p.history.length = 0;
    p.history.push({ p: hit.point.clone(), t: performance.now() });

  }
  if (!hit.object.userData.body) return;      // walls, containers and lids block grabs
  const body = hit.object.userData.body, tch = body.char;
  const tEnt = entityOf(tch);
  if (tEnt) endDrag(tEnt);
  if (tch === npc && brain.drag) releaseDrag(false);
  if (tch.heldBy) return;
  if (tch.goRagdoll()) { scores[p.key]++; updateScore(); fx.bubble(tch, 'grab'); }
  p.dragPlane.setFromNormalAndCoplanarPoint(dir.clone().negate(), hit.point);
  p.joint.position.copy(toC(hit.point));

/* ================= Networking (PeerJS room codes, up to 4 players) ================= */
// The host runs the game; each guest has their own connection to the host and takes a free slot (P2–P4).
const net = { role: 'solo', peer: null, conn: null, lastSend: 0, leaving: false, code: '' };
const mpEl = document.getElementById('mp'), mpStatus = document.getElementById('mpStatus');
const setStatus = (html) => { mpStatus.innerHTML = html; };
const guests = () => PLAYERS.filter((p) => p.conn);

}
function netSendTo(p, msg) { sendOn(p.conn, msg); }
function makeCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function leaveGame(silent) {

  try { if (net.conn) net.conn.close(); } catch (_) {}
  for (const p of guests()) { try { p.conn.close(); } catch (_) {} }
  try { if (net.peer) net.peer.destroy(); } catch (_) {}

  net.role = 'solo';

  net.leaving = false;

}
function roomStatus(extra) {
  const n = guests().length;
  setStatus(`Room code: <b>${net.code}</b><br>${extra ? extra + '<br>' : ''}${n ? `${n + 1} of ${MAX_PLAYERS} players in.` : `Up to ${MAX_PLAYERS - 1} friends can join: on their device, open this same file, press “Play with friends” and enter this code.`}`);
}
function hostGame() {
  if (!window.Peer) { setStatus('Couldn\'t load the multiplayer library — check your internet connection.'); return; }
  leaveGame(true);
  const code = net.code = makeCode();
  const peer = new Peer(ROOM_PREFIX + code, PEER_OPTS);
  net.peer = peer;
  setStatus('Creating a room…');
  peer.on('open', () => roomStatus());
  peer.on('connection', (c) => {
    const p = PLAYERS.find((q) => q !== P1 && !q.conn);
    if (!p) { c.on('open', () => { sendOn(c, { t: 'full' }); setTimeout(() => c.close(), 400); }); return; }
    p.conn = c;
    c.on('open', () => { net.role = 'host'; guestJoined(p); roomStatus(`${p.label} joined! 🎉`); });
    c.on('data', (m) => { if (p.conn === c) onHostData(p, m); });
    const gone = () => {
      if (p.conn !== c) return;
      p.conn = null;
      if (!guests().length) net.role = 'solo';
      if (!net.leaving) { guestLeft(p); roomStatus(`${p.label} left.`); }
    };
    c.on('close', gone); c.on('error', gone);

}
function joinGame(code) {
  code = code.trim().toUpperCase();
  if (code.length !== 4) { setStatus('Enter the 4-letter room code from the host.'); return; }
  if (!window.Peer) { setStatus('Couldn\'t load the multiplayer library — check your internet connection.'); return; }
  leaveGame(true);
  const peer = new Peer(PEER_OPTS);
  net.peer = peer;
  setStatus('Connecting…');
  peer.on('open', () => {
    const c = peer.connect(ROOM_PREFIX + code, { serialization: 'json', reliable: true });
    net.conn = c;
    c.on('open', () => {
      if (net.role !== 'client') { net.role = 'client'; becomeClient(); }
      setStatus(`Connected to room <b>${code}</b>! 🎉`); mpEl.classList.remove('open');
    });
    c.on('data', (m) => { if (net.conn === c) onClientData(m); });   // ignore stragglers after leaving
    const gone = () => { if (net.conn !== c || net.leaving) return; net.conn = null; net.role = 'solo'; becomeSolo(); setStatus('The host left the game. You\'re playing solo.'); };
    c.on('close', gone); c.on('error', gone);
  });
  peer.on('error', (e) => setStatus(e.type === 'peer-unavailable' ? 'No game found with that code. Check it and try again.' : 'Connection problem: ' + e.type + '. Try again.'));
}

/* host side */

    gotSlot = true;
    Object.assign(me.ch.root, { x: m.r[0], y: 0, z: m.r[2] });
    cam.yaw = m.yaw; cam.pitch = -0.1;
    me.vel.x = me.vel.y = me.vel.z = 0;
    needRoot = false;
    return;
  }
  if (m.t !== 's' || !gotSlot) return;
  SCORE_KEYS.forEach((k, i) => { scores[k] = m.sc[i] || 0; });
  if (Array.isArray(m.lids)) m.lids.forEach((a, i) => { const c = CONTAINERS[i]; if (c && Array.isArray(a)) { c.open = !!a[0]; c.angle = a[1]; placeDoor(c); } });
  if (Array.isArray(m.hd)) PLAYERS.forEach((p, i) => { p.hiding = CONTAINERS[m.hd[i]] || null; });
  if (settings.npcAI !== !!m.ai) { settings.npcAI = !!m.ai; updateNpcBtn(); }
  if (Array.isArray(m.dr)) m.dr.forEach((a, i) => { const l = doorLeaves[i]; if (l && l.angle !== a) { l.angle = a; placeLeaf(l); } });
  if (Array.isArray(m.fu)) m.fu.forEach((a, i) => {
    const f = FURNITURE[i];
    if (!f || !a) return;
    if (!f.net) { f.net = { p: new THREE.Vector3(a[0], a[1], a[2]), q: new THREE.Quaternion(a[3], a[4], a[5], a[6]) }; f.mesh.position.copy(f.net.p); f.mesh.quaternion.copy(f.net.q); }
    f.net.p.set(a[0], a[1], a[2]); f.net.q.set(a[3], a[4], a[5], a[6]);
  });
  [npc, ...PLAYERS.map((p) => p.ch)].forEach((ch, i) => {
    const a = m.c[i];
    if (!a) return;
    ch.setActive(!!a[4]);
    const prev = ch.state;
    ch.state = a[0];
    if (ch === me.ch && ((prev !== 'up' && ch.state === 'up') || needRoot)) {   // you just stood back up (or just joined)
      needRoot = false;
      Object.assign(ch.root, { x: a[1], y: a[2], z: a[3] });
      me.vel.x = me.vel.y = me.vel.z = 0;
      cam.pitch = Math.max(cam.pitch, -0.6);
      updateHint();
    } else if (ch === me.ch && prev !== ch.state) updateHint();
    if (!ch.net) ch.net = NAMES.map(() => ({ p: new THREE.Vector3(), q: new THREE.Quaternion(), init: false }));
    NAMES.forEach((n, k) => {
      const o = 5 + k * 7, t = ch.net[k];
      t.p.set(a[o], a[o + 1], a[o + 2]); t.q.set(a[o + 3], a[o + 4], a[o + 5], a[o + 6]);
      if (!t.init) { ch.parts[n].mesh.position.copy(t.p); ch.parts[n].mesh.quaternion.copy(t.q); t.init = true; }
    });
  });
  updateScore();
  const seen = new Set();
  for (const a of m.p) {
    seen.add(a[0]);
    let cp = clientPlants.get(a[0]);
    if (!cp) { cp = { mesh: makePlantMesh(), p: new THREE.Vector3(), q: new THREE.Quaternion() }; scene.add(cp.mesh); clientPlants.set(a[0], cp); cp.mesh.position.set(a[1], a[2], a[3]); }
    cp.p.set(a[1], a[2], a[3]); cp.q.set(a[4], a[5], a[6], a[7]);
  }
  for (const [id, cp] of clientPlants) if (!seen.has(id)) { scene.remove(cp.mesh); clientPlants.delete(id); }
  for (const ev of m.ev) {
    const v3 = (a) => new THREE.Vector3().fromArray(a);
    if (ev.e === 'tr') addTracer(v3(ev.a), v3(ev.b), ev.c);
    else if (ev.e === 'fl') addFlash(v3(ev.p), ev.s, ev.c);
    else if (ev.e === 'bu') bubble(charByKey(ev.w), ev.k);
    else if (ev.e === 'sx') { if (!(ev.n === 'pew' && ev.by === me.key)) sfx(ev.n); }
    else if (ev.e === 'wa') showWarn(ev.k, ev.w);

}
function clientInterpolate(dt) {
  const k = 1 - Math.exp(-dt * 25);
  for (const ch of [npc, ...PLAYERS.map((p) => p.ch)]) {
    if (!ch.net) continue;
    NAMES.forEach((n, i) => { const t = ch.net[i], mesh = ch.parts[n].mesh; mesh.position.lerp(t.p, k); mesh.quaternion.slerp(t.q, k); });
  }
  for (const [, cp] of clientPlants) { cp.mesh.position.lerp(cp.p, k); cp.mesh.quaternion.slerp(cp.q, k); }
  for (const f of FURNITURE) if (f.net) { f.mesh.position.lerp(f.net.p, k); f.mesh.quaternion.slerp(f.net.q, k); }
}

/* ================= Input ================= */
const isLocked = () => document.pointerLockElement === renderer.domElement;
const HINTS = { blaster: 'Click to shoot', plant: 'Click to throw a plant', grab: 'Hold click to grab · while holding, hold right-click to charge a throw' };
function updateHint() {
  const move = 'WASD move · Space jump · Shift sprint';
  const lookTxt = isLocked() ? 'Esc frees mouse' : lockFailed ? 'right-drag to look (mouse lock blocked here)' : 'click to lock mouse';
  document.getElementById('hint').textContent = me.ch.state === 'up'
    ? `${HINTS[tool]} · ${move} · ${lookTxt}`
    : me.ch.state === 'jump' ? 'Jumping out!'
    : me.hiding ? `Hiding in the ${me.hiding.name} · Move the mouse to look around`
    : 'You got ragdolled! Move the mouse to look around while you get back up…';
}
function setPointer(e) {
  if (isLocked()) { pointerNdc.set(0, 0); return; }
  pointerNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}
function tryLock() {
  if (lockFailed || isLocked()) return;
  try {
    const r = renderer.domElement.requestPointerLock();
    if (r && r.catch) r.catch(() => { lockFailed = true; updateHint(); });
  } catch (_) { lockFailed = true; updateHint(); }
}
function setTool(t) {
  tool = t;
  for (const b of document.querySelectorAll('[data-tool]')) b.classList.toggle('active', b.dataset.tool === t);
  pBlaster.g.visible = t === 'blaster';
  heldPlant.visible = t === 'plant';
  hand.visible = t === 'grab';
  handMat.color.setHex(me.skin);       // your own skin colour
  document.getElementById('tFire').textContent = { blaster: '🔫', plant: '🪴', grab: '✋' }[t];
  updateHint();
}
for (const b of document.querySelectorAll('[data-tool]')) b.onclick = () => setTool(b.dataset.tool);
document.getElementById('reset').onclick = () => requestReset();
function requestReset() { if (net.role === 'client') netSend({ t: 'reset' }); else reset(); }
document.getElementById('mpBtn').onclick = () => { if (document.exitPointerLock) document.exitPointerLock(); mpEl.classList.add('open'); };
document.getElementById('closeBtn').onclick = () => mpEl.classList.remove('open');
document.getElementById('hostBtn').onclick = () => hostGame();
document.getElementById('joinBtn').onclick = () => joinGame(document.getElementById('codeIn').value);
document.getElementById('codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinGame(e.target.value); });
document.getElementById('leaveBtn').onclick = () => leaveGame(false);
mpEl.addEventListener('pointerdown', (e) => { if (e.target === mpEl) mpEl.classList.remove('open'); });
const npcBtn = document.getElementById('npcBtn');
function updateNpcBtn() {
  npcBtn.innerHTML = settings.npcAI ? '🤖 NPC: On<kbd>N</kbd>' : '🧸 NPC: Ragdoll<kbd>N</kbd>';
  npcBtn.classList.toggle('active', !settings.npcAI);
}
function setNpcAI(on) {           // host only; the guests get it in the snapshot
  settings.npcAI = on;
  if (on) npc.stillTime = 0;      // it gets back up in a moment
  updateNpcBtn();
}
function toggleNpc() { if (net.role === 'client') netSend({ t: 'npc', on: !settings.npcAI }); else setNpcAI(!settings.npcAI); }
npcBtn.onclick = () => toggleNpc();
updateNpcBtn();

document.addEventListener('pointerlockerror', () => { lockFailed = true; updateHint(); });
document.addEventListener('pointerlockchange', () => {
  document.body.classList.toggle('locked', isLocked());
  if (isLocked()) pointerNdc.set(0, 0); else actRelease();
  updateHint();
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); tpDist = THREE.MathUtils.clamp(tpDist + Math.sign(e.deltaY) * 1.5, 5, 24); }, { passive: false });
function look(dx, dy, s) {
  cam.yaw -= dx * s;
  cam.pitch = THREE.MathUtils.clamp(cam.pitch - dy * s, -1.45, 1.45);
}
// use the current tool (left click, or the fire button on touch)
function useTool() {
  if (tool === 'grab') actGrab();
  else if (tool === 'blaster') { actShoot(); firing = true; nextFire = performance.now() + 140; }
  else actThrow();
}
let toolPointer = null;          // the touch that's using the tool, so other fingers lifting don't let go
window.addEventListener('pointerdown', (e) => {
  if (e.target !== renderer.domElement) return;
  if (e.pointerType === 'touch') {           // touch: the screen is for looking; the buttons do the rest
    enableTouch();
    looking = { x: e.clientX, y: e.clientY, id: e.pointerId };
    return;
  }
  if (e.button === 2 || e.button === 1) { looking = { x: e.clientX, y: e.clientY, id: e.pointerId }; return; }

window.addEventListener('pointermove', (e) => {
  if (isLocked()) { look(e.movementX || 0, e.movementY || 0, 0.0025); return; }
  if (looking && (e.pointerType !== 'touch' || e.pointerId === looking.id)) {
    look(e.clientX - looking.x, e.clientY - looking.y, e.pointerType === 'touch' ? 0.006 : 0.004);
    looking.x = e.clientX; looking.y = e.clientY;
    return;
  }
  if (!touchUI) setPointer(e);
});
window.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'touch') {
    if (looking && e.pointerId === looking.id) looking = null;
    if (e.pointerId === toolPointer) { toolPointer = null; actRelease(); }
    return;
  }
  if (looking && e.button !== 0) { looking = null; return; }
  actRelease();
});
// right-click while holding someone charges a throw (mouse events, because a second button
// pressed during a pointer drag doesn't fire pointerdown)
const chargeEl = document.getElementById('charge'), chargeFill = chargeEl.querySelector('i');
function chargePower() { return chargeStart ? Math.min(1, (performance.now() - chargeStart) / (CHARGE_TIME * 1000)) : 0; }
function startCharge() { if (tool === 'grab' && grabHeld && me.ch.state === 'up') { chargeStart = performance.now(); return true; } return false; }
function releaseCharge() {
  if (!chargeStart) return;
  const pw = chargePower();
  chargeStart = 0;
  const d = aimRay().direction.clone();
  if (net.role === 'client') netSend({ t: 'th', d: d.toArray(), pw });
  else throwHeld(me, d, pw);
}
window.addEventListener('mousedown', (e) => { if (e.button === 2 && startCharge()) { looking = null; e.preventDefault(); } });
window.addEventListener('mouseup', (e) => { if (e.button === 2) releaseCharge(); });
function pressUse() { if (net.role === 'client') netSend({ t: 'bin' }); else useContainer(me); }      // E
function pressHide() { if (net.role === 'client') netSend({ t: 'hide' }); else hide(me); }          // F

/* ================= Touch controls ================= */
// left: a joystick to walk (push it all the way to sprint); drag anywhere else to look;
// right: buttons to use your tool, jump, E, F and (while holding someone) charge a throw
let touchUI = false;
const touchStick = { on: false, x: 0, y: 0, id: null };
function enableTouch() {
  if (touchUI) return;
  touchUI = true;
  document.body.classList.add('touch');
  pointerNdc.set(0, 0);                      // aim with the crosshair in the middle
  updateHint();
}
window.addEventListener('touchstart', enableTouch, { passive: true, capture: true });
const stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
function moveStick(e) {
  const r = stickEl.getBoundingClientRect(), R = r.width / 2;
  let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  touchStick.x = dx; touchStick.y = dy;
  knobEl.style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
}
stickEl.addEventListener('pointerdown', (e) => {
  e.preventDefault(); enableTouch();
  stickEl.setPointerCapture(e.pointerId);
  Object.assign(touchStick, { on: true, id: e.pointerId });
  moveStick(e);
});
stickEl.addEventListener('pointermove', (e) => { if (e.pointerId === touchStick.id) moveStick(e); });
const endStick = (e) => {
  if (e.pointerId !== touchStick.id) return;
  Object.assign(touchStick, { on: false, x: 0, y: 0, id: null });
  knobEl.style.transform = '';
};
stickEl.addEventListener('pointerup', endStick);
stickEl.addEventListener('pointercancel', endStick);
function holdButton(id, down, up) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation(); enableTouch();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add('on');
    down(e);
  });
  const end = () => { if (!el.classList.contains('on')) return; el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  return el;
}
const tFire = holdButton('tFire', (e) => { pointerNdc.set(0, 0); toolPointer = e.pointerId; useTool(); }, () => { toolPointer = null; actRelease(); });
holdButton('tJump', () => keys.add('Space'), () => keys.delete('Space'));
holdButton('tE', () => pressUse());
holdButton('tF', () => pressHide());
const tThrow = holdButton('tThrow', () => startCharge(), () => releaseCharge());
const promptEl = document.getElementById('prompt');
let promptHtml = '';
function updateContainerPrompt() {
  let key = '', html = '';
  const stuck = me.ch.state === 'ragdoll' && CONTAINERS.find((c) => !c.open && inPos(c, me.ch.parts.torso.mesh.position));
  const near = me.ch.state === 'up' && nearContainer(me.ch.root);
  if (me.hiding) {
    key = 'hiding' + me.hiding.id; html = `Hiding in the ${me.hiding.name} 🤫 Press <kbd>E</kbd> or <kbd>F</kbd> to come out`;
  } else if (stuck) {
    key = 'stuck' + stuck.id; html = `You're stuck in the ${stuck.name}! Mash <kbd>E</kbd> to push the ${{ lid: 'lid', door: 'door', double: 'doors' }[stuck.kind]} open`;
  } else if (near) {
    key = (near.open ? 'close' : 'open') + near.id;
    html = `Press <kbd>E</kbd> to ${near.open ? 'close' : 'open'} the ${near.name}`;
    if (near.open && !allChars().some((ch) => inPos(near, ch.parts.torso.mesh.position))) html += ' · <kbd>F</kbd> to hide inside';
  }
  if (html === promptHtml) return;
  promptHtml = html;
  promptEl.style.display = key ? 'block' : 'none';
  promptEl.classList.toggle('stuck', key.startsWith('stuck'));
  promptEl.innerHTML = html;
}
function updateChargeUI() {
  if (chargeStart && (!grabHeld || me.ch.state !== 'up')) chargeStart = 0;   // let go or got knocked down
  chargeEl.style.display = chargeStart ? 'block' : 'none';
  if (chargeStart) chargeFill.style.width = (chargePower() * 100) + '%';
  tThrow.hidden = !(tool === 'grab' && grabHeld && me.ch.state === 'up');
}
window.addEventListener('pointercancel', (e) => {
  if (looking && e.pointerId === looking.id) looking = null;
  if (e.pointerType !== 'touch' || e.pointerId === toolPointer) { toolPointer = null; actRelease(); }
});
window.addEventListener('blur', () => keys.clear());
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;            // typing a room code
  keys.add(e.code);
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyE' && !e.repeat) pressUse();
  if (e.code === 'KeyF' && !e.repeat) pressHide();
  if (e.code === 'KeyN' && !e.repeat) toggleNpc();
  if (e.key === '1') setTool('blaster');
  else if (e.key === '2') setTool('plant');
  else if (e.key === '3') setTool('grab');
  else if (e.key === 'r' || e.key === 'R') requestReset();
});

function reset() {
  for (const p of PLAYERS) endDrag(p);
  if (brain.drag) { world.removeConstraint(brain.drag.c); brain.drag = null; }
  for (const p of plants) { scene.remove(p.mesh); world.removeBody(p.body); }
  plants.length = 0;
  npc.reset(20, 0, -Math.PI / 2);
  Object.assign(brain, { mode: 'wander', timer: 3, panic: 0, target: null, jumpOut: null });
  for (const c of CONTAINERS) { Object.assign(c, { open: false, angle: LID_CLOSED, pushes: 0 }); c.trap.clear(); placeDoor(c); }
  for (const f of FURNITURE) { f.heldBy = null; placeFurniture(f); }
  for (const l of doorLeaves) { l.angle = 0; placeLeaf(l); }
  for (const k of SCORE_KEYS) scores[k] = 0;
  pickWander();
  for (const p of players()) spawnPlayer(p);
  updateScore(); updateHint();
}

/* ================= Loop ================= */
const clock = new THREE.Clock();
let lastMeState = 'up';
function hostFrame(dt, now) {
  for (const p of players()) p.grace = Math.max(0, p.grace - dt);
  if (firing && tool === 'blaster' && now >= nextFire) { actShoot(); nextFire = now + 140; }
  // this device's aim ray (used for dragging)
  const ray = aimRay(); me.ray.o.copy(ray.origin); me.ray.d.copy(ray.direction);
  updateContainers(dt);
  updateHouseDoors(dt);
  for (const p of players()) hostDrivePlayer(p, dt);
  updateNpc(dt);
  for (const p of players()) updateDrag(p);
  world.step(1 / 120, dt, 12);
  for (const ch of allChars()) {
    if (!ch.pendingHits.length) continue;
    const h = ch.pendingHits.reduce((a, b) => (b.rel > a.rel ? b : a));
    ch.pendingHits.length = 0;
    if (ch.state !== 'ragdoll') hitChar(ch, h.body, h.impulse, h.point, h.kind || 'plant', null, h.by);
    else if (now - ch.lastHitAt > 300) hitChar(ch, h.body, h.impulse.scale(0.3), h.point, h.kind || 'plant', null, h.by);
  }
  for (const p of plants) {
    if (now - p.body.bornAt > 700) p.body.collisionFilterMask = GROUP.WORLD | ALL_CHARS;   // now it can hit anybody
    p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion);
  }
  for (const f of FURNITURE) {
    if (!Number.isFinite(f.body.position.x) || f.body.position.y < -20) placeFurniture(f);
    f.mesh.position.copy(f.body.position); f.mesh.quaternion.copy(f.body.quaternion);
  }
  for (const ch of allChars()) ch.sync();
  for (const ch of allChars()) { const t = ch.torso.position; if (!Number.isFinite(t.x) || t.y < -20) { reset(); break; } }
  if (net.role === 'host' && now - net.lastSend > 33) { net.lastSend = now; netSend(snapshot()); }
}
function clientFrame(dt, now) {
  if (firing && tool === 'blaster' && now >= nextFire) { actShoot(); nextFire = now + 140; }
  if (me.ch.state === 'up' && gotSnapshot && !needRoot) localMove(me, dt);
  if (!needRoot && now - net.lastSend > 33) {
    net.lastSend = now;
    const ray = aimRay(), r = me.ch.root;
    netSend({ t: 'in', r: [r3(r.x), r3(r.y), r3(r.z)], yaw: r3(cam.yaw), pitch: r3(cam.pitch), ph: r3(me.ch.phase), amp: r3(me.ch.amp),
              v: [r3(me.vel.x), r3(me.vel.y), r3(me.vel.z)], o: ray.origin.toArray().map(r3), d: ray.direction.toArray().map(r3) });
  }
  clientInterpolate(dt);
}
const cdBar = document.getElementById('cdbar'), cdFill = cdBar.firstElementChild;
const cdBtn = { blaster: document.querySelector('[data-tool="blaster"] .cd'), plant: document.querySelector('[data-tool="plant"] .cd') };
function updateCooldownUI(now) {
  for (const k of ['blaster', 'plant']) {
    const left = Math.max(0, me.cd[k] - now) / (COOLDOWN[k] * 1000);   // 1 → just used, 0 → ready
    cdBtn[k].style.width = (left * 100) + '%';
    if (k === tool) {
      cdBar.style.display = left > 0 && me.ch.state === 'up' ? 'block' : 'none';
      cdFill.style.width = ((1 - left) * 100) + '%';
    }
  }
  if (tool === 'grab') cdBar.style.display = 'none';
}
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  if (net.role === 'client') clientFrame(dt, now); else hostFrame(dt, now);
  updateCooldownUI(now);
  if (me.ch.state + !!me.hiding !== lastMeState) { lastMeState = me.ch.state + !!me.hiding; updateHint(); }
  updateCamera(dt);
  // the roof hides while you're indoors (or the camera is) so you can see what's going on
  roof.visible = !(inHouse(me.ch.state === 'up' ? me.ch.root : me.ch.parts.torso.mesh.position, 0.5) || (inHouse(camera.position, 0.5) && camera.position.y < ROOF_Y + 2));
  held.position.z += (-1.1 - held.position.z) * Math.min(1, dt * 14);
  updateChargeUI();
  updateContainerPrompt();
  animateHand(dt);
  if (alertTimer > 0) { alertTimer -= dt; if (alertTimer <= 0) alertEl.classList.remove('show'); }
  for (let i = effects.length - 1; i >= 0; i--) if (!effects[i].update(dt)) effects.splice(i, 1);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__debug = () => {
  const v = npc.parts.torso.mesh.position.clone().project(camera);
  const other = PLAYERS.find((p) => p !== me && p.ch.active) || me;
  const w = other.ch.parts.torso.mesh.position.clone().project(camera);
  return { role: net.role, npc: npc.state, mode: brain.mode, me: me.ch.state, other: other.ch.state, scores: { ...scores }, slot: me.slot,
           hiding: me.hiding && me.hiding.id, lids: CONTAINERS.map((c) => c.open),
           sx: (v.x + 1) / 2 * innerWidth, sy: (1 - v.y) / 2 * innerHeight, ox: (w.x + 1) / 2 * innerWidth, oy: (1 - w.y) / 2 * innerHeight,
           npcFront: v.z < 1, otherFront: w.z < 1, plants: plants.length + clientPlants.size };
};
lockFailed = !('requestPointerLock' in renderer.domElement);
setTool('blaster');
reset();
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
